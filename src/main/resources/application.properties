# --- Base de datos (MySQL del docker-compose.yml, puerto 3307) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/bd_planilla?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:mysql}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Auditoría (Envers): tablas *_aud con el historial de cada cambio
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_aud
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Servidor (8080 suele estar ocupado en esta máquina) ---
server.port=${PORT:6903}
# Detrás de un proxy o túnel (Render, Cloudflare...) respeta el dominio y https originales
server.forward-headers-strategy=framework
# La pantalla de Angular incluida en el jar la sirve SpaWebConfig
spring.web.resources.add-mappings=false

# --- Carga de archivos (carga masiva de empleados por Excel) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Seguridad ---
# En producción define JWT_SECRET (Base64, mínimo 256 bits). El valor por defecto es SOLO para desarrollo.
app.jwt.secret=${JWT_SECRET:Q2xhdmVTZWNyZXRhTXV5U2VndXJhUGFyYUVsUHJveWVjdG9EZVBsYW5pbGxhc0VuU3ByaW5nQm9vdA==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Orígenes permitidos para CORS y WebSocket (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}

# --- Parámetros legales de planilla (VERIFICAR antes de cada cierre; ver PlanillaProperties) ---
app.planilla.rmv=${RMV:1230}
app.planilla.uit=${UIT:5500}
app.planilla.ruc=${EMPRESA_RUC:20604919321}
app.planilla.razon-social=${EMPRESA_RAZON_SOCIAL:INFORMA PERU S.A.C.}
app.planilla.direccion=${EMPRESA_DIRECCION:CAL. HUAMACHUCO NRO. 1408 DPTO. 704 LIMA - LIMA - JESUS MARIA}
app.planilla.lugar-pago=${EMPRESA_LUGAR:LIMA}
# Horario por defecto cuando el trabajador no tiene horario programado en el tareo
app.planilla.hora-entrada-defecto=09:00
app.planilla.hora-salida-defecto=18:00
# Tardanzas injustificadas en el mes que descuentan un día adicional (comunicado de la empresa)
app.planilla.tardanzas-para-dia-adicional=5

# --- Correo (envío de boletas en PDF). Sin MAIL_HOST el envío queda desactivado y la pantalla lo avisa. ---
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.correo.remitente=${MAIL_FROM:planillas@informaperu.com}
app.correo.habilitado=${MAIL_HABILITADO:false}

# --- Datos iniciales (regímenes, conceptos y primer usuario admin). Solo crea lo que falta. ---
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-username=${ADMIN_USER:admin}
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
