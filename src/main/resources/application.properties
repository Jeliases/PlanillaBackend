# --- Base de datos (MySQL del docker-compose.yml, puerto 3307) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/bd_planilla?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:mysql}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Servidor (8080 suele estar ocupado en esta máquina) ---
server.port=${PORT:8081}

# --- Carga de archivos (carga masiva de empleados por Excel) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Seguridad ---
# En producción define JWT_SECRET (Base64, mínimo 256 bits). El valor por defecto es SOLO para desarrollo.
app.jwt.secret=${JWT_SECRET:Q2xhdmVTZWNyZXRhTXV5U2VndXJhUGFyYUVsUHJveWVjdG9EZVBsYW5pbGxhc0VuU3ByaW5nQm9vdA==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Orígenes permitidos para CORS y WebSocket (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

# --- Parámetros legales de planilla (VERIFICAR antes de cada cierre; ver PlanillaProperties) ---
app.planilla.rmv=${RMV:1130}
app.planilla.uit=${UIT:5500}
app.planilla.ruc=${EMPRESA_RUC:20123456789}

# --- Datos iniciales (regímenes, conceptos y primer usuario admin). Solo crea lo que falta. ---
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin-username=${ADMIN_USER:admin}
app.seed.admin-password=${ADMIN_PASSWORD:admin123}
